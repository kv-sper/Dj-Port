<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KVSPER | Portfólio</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* Gradiente de fundo sutil */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(20, 10, 30, 0.9), #000000);
            z-index: -2;
        }

        .glow-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff00cc, #3333ff, #ff00cc);
            background-size: 200% 100%;
            animation: moveGlow 3s ease infinite;
            z-index: 100;
        }

        @keyframes moveGlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* Header / Bio */
        .dj-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 30px rgba(0,255,255,0.1);
        }

        .dj-name {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #aaffff, #ff66cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .dj-tagline {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .dj-bio {
            max-width: 700px;
            margin: 1rem auto;
            font-size: 1rem;
            color: #ddd;
            background: rgba(255,255,255,0.05);
            padding: 1rem 1.5rem;
            border-radius: 2rem;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        /* Redes sociais */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }

        .social-icon {
            background: #1e1e2a;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #eee;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .social-icon:hover {
            transform: translateY(-5px);
            color: #fff;
            border-color: #ff66cc;
            box-shadow: 0 0 15px #ff66cc66;
            background: #2a2a36;
        }

        /* Seções comuns */
        .section {
            margin-bottom: 4rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-left: 5px solid #ff66cc;
            padding-left: 1rem;
        }

        .section-title i {
            color: #ff66cc;
            font-size: 1.8rem;
        }

        /* Cards de vídeos */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .video-card {
            background: rgba(20,20,30,0.7);
            backdrop-filter: blur(8px);
            border-radius: 1.2rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }

        .video-card:hover {
            transform: scale(1.02);
            border-color: #ff66cc;
            box-shadow: 0 0 20px rgba(255,102,204,0.3);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            padding: 0.8rem 1rem;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
        }

        /* Cartazes / Flyers */
        .flyers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.8rem;
        }

        .flyer-card {
            background: #111;
            border-radius: 1rem;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .flyer-card img {
            width: 100%;
            aspect-ratio: 1 / 1.2;
            object-fit: cover;
            display: block;
            transition: 0.3s;
        }

        .flyer-card:hover img {
            transform: scale(1.03);
        }

        .flyer-caption {
            padding: 0.6rem;
            text-align: center;
            font-size: 0.85rem;
            color: #bbb;
            background: #0a0a0a;
        }

        /* Agenda */
        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-item {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }

        .event-item:hover {
            border-color: #ff66cc;
            background: #1a1a2a;
        }

        .event-date {
            font-weight: 700;
            background: #ff66cc20;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            display: inline-block;
            color: #ffccff;
        }

        .event-location {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0.3rem 0;
        }

        .event-details {
            flex: 2;
        }

        .event-more {
            font-size: 0.8rem;
            color: #aaaaee;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #888;
        }

        @media (max-width: 700px) {
            .container {
                padding: 1rem;
            }
            .dj-name {
                font-size: 2.2rem;
            }
            .event-item {
                flex-direction: column;
                align-items: start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="glow-line"></div>

<div class="container">
    <!-- Cabeçalho + Bio -->
    <div class="dj-header">
        <h1 class="dj-name" id="djName">KVSPER</h1>
        <div class="dj-tagline" id="djTagline">🎧 Open Format Dj & Remixer</div>
        <div class="dj-bio" id="djBio">
            ✨ Criador de experiências sonoras. Sets energéticos e visuais imersivos. Prepare-se para dançar.
        </div>
        <div class="social-links" id="socialLinks"></div>
    </div>

    <!-- Seção Vídeos de Trabalhos -->
    <div class="section">
        <div class="section-title">
            <i class="fas fa-video"></i>
            <span>Sets & Live Performances</span>
        </div>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Seção Cartazes (Flyers) -->
    <div class="section">
        <div class="section-title">
            <i class="fas fa-poster"></i>
            <span>Cartazes / Eventos</span>
        </div>
        <div class="flyers-grid" id="flyersGrid"></div>
    </div>

    <!-- Seção Agenda -->
    <div class="section">
        <div class="section-title">
            <i class="fas fa-calendar-alt"></i>
            <span>Próximos Shows</span>
        </div>
        <div class="agenda-list" id="agendaList"></div>
    </div>

    <footer>
        <i class="fas fa-headphones"></i> © 2026 • Booking: kspbeatz@gmail.com • Siga nas redes
    </footer>
</div>

<script>
    // ============================================================
    // **************  TUDO QUE VOCÊ PRECISA EDITAR  **************
    // ============================================================
    // Altere os dados abaixo como quiser. O site se atualiza sozinho.

    const DJ_DATA = {
        // INFOS PESSOAIS
        name: "DJ KVSPER",
        tagline: "🎧 Open Format DJ & Remixer",
        bio: "DJ residente em Restaurante Outro Nível e BX Pub e Bar. Já toquei em restaurantes da cidade, reveillon na ponta d'ouro (Pinto's & Florestinha do Indico) e festas privadas. Música é a minha linguagem universal.",

        // REDES SOCIAIS (deixe vazio se não quiser exibir)
        social: [
            { platform: "instagram", url: "https://instagram.com/kv_sper.dj", icon: "fab fa-instagram" },
            { platform: "soundcloud", url: "https://soundcloud.com/kv_sper", icon: "fab fa-soundcloud" },
            { platform: "youtube", url: "https://youtube.com/@kv_sper", icon: "fab fa-youtube" },
            { platform: "spotify", url: "https://open.spotify.com/artist/seudj", icon: "fab fa-spotify" }
        ],

        // VÍDEOS (YouTube ou Vimeo - basta copiar o ID ou link embed)
        // Para vídeo do YouTube: use "https://www.youtube.com/embed/CODIGO"
        videos: [
            { title: "Live @ Warehouse Festival 2024", embed: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
            { title: "Boiler Room Style Set (Preview)", embed: "https://www.youtube.com/embed/jfKfPfyJRdk" },
            { title: "Sunset Session - Beach Club", embed: "https://www.youtube.com/embed/3JZ_D3ELwOQ" }
        ],

        // CARTAZES (coloque URLs de imagens reais suas ou use placeholders)
        // Sugiro imagens no formato quadrado/retrato. Você pode usar links do Imgur, Drive, ou imagens locais (se colocar na mesma pasta)
        flyers: [
            { image: "assets/flyers/The Ritual Cover.png", caption: "EP The Ritual" },
            { image: "https://placehold.co/400x500/1a1e2a/66ccff?text=UNDERGROUND+VIBE", caption: "Cripta Club - 22 Junho" },
            { image: "https://placehold.co/400x500/2a1a2a/ffaa44?text=SUNSET+SET", caption: "Praia Sound - 05 Julho" },
            { image: "https://placehold.co/400x500/0f1f2f/ff66aa?text=NEON+FEST", caption: "Mainstage Festival - 18 Ago" }
        ],

        // AGENDA: listas de datas, locais e info extra
        events: [
            { date: "SÁBADO, 14 JUN 2025", location: "Clube Vibe - São Paulo, SP", extra: "Abertura: 23h. Ingressos na porta." },
            { date: "SEXTA, 15 MAIO 2026", location: "Restaurante Outro Nivel, Bairro Infulene "A", Canhueiro", extra: "Karaoke + Dj Set." },
            { date: "SÁBADO, 16 MAIO 2026", location: "Restaurante Outro Nivel, Bairro Infulene "A", Canhueiro", extra: "ChillOut." },
            { date: "DOMINGO, 03 AGO 2025", location: "Música Festival - Curitiba, PR", extra: "Palco principal, 20h." }
        ]
    };

    // ========== FUNÇÕES QUE RENDERIZAM OS DADOS ==========
    function renderHeader() {
        document.getElementById("djName").innerText = DJ_DATA.name;
        document.getElementById("djTagline").innerText = DJ_DATA.tagline;
        document.getElementById("djBio").innerHTML = `✨ ${DJ_DATA.bio}`;
        
        const socialContainer = document.getElementById("socialLinks");
        socialContainer.innerHTML = "";
        DJ_DATA.social.forEach(soc => {
            const link = document.createElement("a");
            link.href = soc.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "social-icon";
            link.innerHTML = `<i class="${soc.icon}"></i>`;
            socialContainer.appendChild(link);
        });
    }

    function renderVideos() {
        const container = document.getElementById("videosGrid");
        container.innerHTML = "";
        DJ_DATA.videos.forEach(vid => {
            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
                <div class="video-wrapper">
                    <iframe src="${vid.embed}" title="${vid.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="video-title">${vid.title}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderFlyers() {
        const container = document.getElementById("flyersGrid");
        container.innerHTML = "";
        DJ_DATA.flyers.forEach((flyer, idx) => {
            const card = document.createElement("div");
            card.className = "flyer-card";
            card.innerHTML = `
                <img src="${flyer.image}" alt="flyer ${idx}" loading="lazy">
                <div class="flyer-caption">${flyer.caption}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderAgenda() {
        const container = document.getElementById("agendaList");
        container.innerHTML = "";
        DJ_DATA.events.forEach(ev => {
            const eventDiv = document.createElement("div");
            eventDiv.className = "event-item";
            eventDiv.innerHTML = `
                <div class="event-details">
                    <span class="event-date"><i class="far fa-calendar-check"></i> ${ev.date}</span>
                    <div class="event-location"><i class="fas fa-map-marker-alt"></i> ${ev.location}</div>
                    <div class="event-more">${ev.extra}</div>
                </div>
                <div><i class="fas fa-ticket-alt" style="color:#ff66cc;"></i> Em breve</div>
            `;
            container.appendChild(eventDiv);
        });
    }

    // Inicializar tudo
    renderHeader();
    renderVideos();
    renderFlyers();
    renderAgenda();

    // Caso queira adicionar um console amigável avisando como editar
    console.log("🎧 Portfólio DJ carregado! Para editar conteúdo, modifique o objeto DJ_DATA no código (linhas ~150 a 210).");
</script>
</body>
</html>
