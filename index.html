<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KVSPER | Portfólio</title>
    <link rel="icon" type="image/png" href="https://www.flaticon.com/free-icons/dj-mixer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f0f0f0; line-height: 1.5; scroll-behavior: smooth; }
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 10% 20%, rgba(20,10,30,0.9), #000000); z-index: -2; }
        .glow-line { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #ff00cc, #3333ff, #ff00cc); background-size: 200% 100%; animation: moveGlow 3s ease infinite; z-index: 100; }
        @keyframes moveGlow { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
        .container { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
        .dj-header { text-align: center; margin-bottom: 3rem; padding: 2rem 1rem; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(0,255,255,0.1); }
        .dj-name { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, #aaffff, #ff66cc); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 0.5rem; }
        .dj-tagline { font-size: 1.2rem; color: #ccc; margin-bottom: 1rem; }
        .dj-bio { max-width: 700px; margin: 1rem auto; background: rgba(255,255,255,0.05); padding: 1rem 1.5rem; border-radius: 2rem; display: inline-block; }
        .social-links { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.2rem; flex-wrap: wrap; }
        .social-icon { background: #1e1e2a; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); color: #eee; }
        .social-icon:hover { transform: translateY(-5px); border-color: #ff66cc; box-shadow: 0 0 15px #ff66cc66; }
        .section { margin-bottom: 4rem; }
        .section-title { font-size: 2rem; font-weight: 700; margin-bottom: 2rem; border-left: 5px solid #ff66cc; padding-left: 1rem; }
        .videos-grid, .flyers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .video-card, .flyer-card { background: rgba(20,20,30,0.7); backdrop-filter: blur(8px); border-radius: 1.2rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .video-card:hover, .flyer-card:hover { transform: scale(1.02); border-color: #ff66cc; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-title, .flyer-caption { padding: 0.8rem; text-align: center; background: rgba(0,0,0,0.6); }
        .flyer-card img { width: 100%; aspect-ratio: 1 / 1.2; object-fit: cover; display: block; }
        .agenda-list { display: flex; flex-direction: column; gap: 1rem; }
        .event-item { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border-radius: 1.2rem; padding: 1rem 1.5rem; display: flex; justify-content: space-between; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.1); }
        .event-date { font-weight: bold; background: #ff66cc20; padding: 0.2rem 0.8rem; border-radius: 2rem; font-size: 0.85rem; }
        footer { text-align: center; padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 2rem; font-size: 0.8rem; color: #888; }
        @media (max-width: 700px) { .dj-name { font-size: 2.2rem; } .event-item { flex-direction: column; gap: 0.5rem; } }
    </style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="glow-line"></div>
<div class="container">
    <div class="dj-header">
        <h1 class="dj-name" id="djName">KVSPER</h1>
        <div class="dj-tagline" id="djTagline">🎧 Open Format DJ & Remixer</div>
        <div class="dj-bio" id="djBio"></div>
        <div class="social-links" id="socialLinks"></div>
    </div>

    <div class="section">
        <div class="section-title"><i class="fas fa-video"></i> Sets & Live Performances</div>
        <div class="videos-grid" id="videosGrid"></div>
            <div class="video-wrapper">
                <iframe src="https://www.tiktok.com/embed/v2/7520622810419580165"
                        frameborder="0"
                        allowfullscreen>
                </iframe>
          </div>
          <div class="video-title">BX Pub Perform</div>
        </div>

    <div class="section">
        <div class="section-title"><i class="fas fa-poster"></i> Cartazes / Eventos</div>
        <div class="flyers-grid" id="flyersGrid"></div>
    </div>

    <div class="section">
        <div class="section-title"><i class="fas fa-calendar-alt"></i> Próximos Eventos</div>
        <div class="agenda-list" id="agendaList"></div>
    </div>

    <footer>
        <i class="fas fa-headphones"></i> © 2026 • Booking: kspbeatz@gmail.com • Siga nas redes
    </footer>
</div>

<script>
    const DJ_DATA = {
        name: "DJ KVSPER",
        tagline: "🎧 Open Format DJ & Remixer",
        bio: "DJ residente: Restaurante Outro Nível e BX Pub e Bar. Passagens por Nova Confiança, O Pátio, Karingani, reveillon na ponta d'ouro (Pinto's & Florestinha do Indico) e festas privadas. Próxima paragem? Seu evento",

        social: [
            { platform: "instagram", url: "https://instagram.com/kv_sper.dj", icon: "fab fa-instagram" },
            { platform: "soundcloud", url: "https://soundcloud.com/kv_sper", icon: "fab fa-soundcloud" },
            { platform: "youtube", url: "https://youtube.com/@kv_sper", icon: "fab fa-youtube" },
            { platform: "tiktok", url: "https://tiktok.com/@kv_sper/", icon: "fab fa-tiktok" }
        ],

        videos: [
            { title: "KV MADEIT - REMAKE SESSION (AV Mozano - Club)", embed: "https://www.youtube.com/embed/5GGREaCu_7Y" },
            { title: "Ellputology Vol1 Mix", embed: "https://www.youtube.com/embed/yTgegUtWLZI" },
            { title: "Pop Funk Beat Making", embed: "https://www.youtube.com/embed/TmjwnCSjDno" }
        ],

        flyers: [
            { image: "assets/flyers/The Ritual Cover.png", caption: "EP The Ritual" }
        ],

        events: [
            { date: "SEXTA, 15 MAIO 2026", location: 'Restaurante Outro Nivel, Bairro Infulene "A", Canhueiro', extra: "Karaoke + Dj Set." },
            { date: "SÁBADO, 16 MAIO 2026", location: 'Restaurante Outro Nivel, Bairro Infulene "A", Canhueiro', extra: "ChillOut." }
        ]
    };

    function renderHeader() {
        document.getElementById("djName").innerText = DJ_DATA.name;
        document.getElementById("djTagline").innerText = DJ_DATA.tagline;
        document.getElementById("djBio").innerHTML = `✨ ${DJ_DATA.bio}`;
        const socialContainer = document.getElementById("socialLinks");
        socialContainer.innerHTML = "";
        DJ_DATA.social.forEach(soc => {
            const link = document.createElement("a");
            link.href = soc.url;
            link.target = "_blank";
            link.className = "social-icon";
            link.innerHTML = `<i class="${soc.icon}"></i>`;
            socialContainer.appendChild(link);
        });
    }

    function renderVideos() {
        const container = document.getElementById("videosGrid");
        container.innerHTML = "";
        DJ_DATA.videos.forEach(vid => {
            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `<div class="video-wrapper"><iframe src="${vid.embed}" frameborder="0" allowfullscreen></iframe></div><div class="video-title">${vid.title}</div>`;
            container.appendChild(card);
        });
    }

    function renderFlyers() {
        const container = document.getElementById("flyersGrid");
        container.innerHTML = "";
        DJ_DATA.flyers.forEach((flyer, idx) => {
            const card = document.createElement("div");
            card.className = "flyer-card";
            card.innerHTML = `<img src="${flyer.image}" alt="flyer" loading="lazy"><div class="flyer-caption">${flyer.caption}</div>`;
            container.appendChild(card);
        });
    }

    function renderAgenda() {
        const container = document.getElementById("agendaList");
        container.innerHTML = "";
        DJ_DATA.events.forEach(ev => {
            const eventDiv = document.createElement("div");
            eventDiv.className = "event-item";
            eventDiv.innerHTML = `<div><span class="event-date">📅 ${ev.date}</span><div><i class="fas fa-map-marker-alt"></i> ${ev.location}</div><small>${ev.extra}</small></div><div><i class="fas fa-ticket-alt" style="color:#ff66cc;"></i> Em breve</div>`;
            container.appendChild(eventDiv);
        });
    }

    renderHeader();
    renderVideos();
    renderFlyers();
    renderAgenda();
</script>
</body>
</html>
